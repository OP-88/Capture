name: Build & Publish Snap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 2.0.3)"
        required: true
        default: "2.0.3"
      channel:
        description: "Snap Store channel to publish to"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - candidate
          - beta
          - edge

permissions:
  contents: read

jobs:
  # CI must pass first before we even attempt a snap build
  test:
    name: Run test suite (gate)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv \
            tesseract-ocr tesseract-ocr-eng \
            libmagic1 libmagic-dev \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-cursor0 libxcb-shape0 libxcb-xfixes0

      - name: Set up Python virtual environment
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Create test fixture image
        run: |
          mkdir -p /tmp/capture_test
          ./venv/bin/python3 -c "
          from PIL import Image
          img = Image.new('RGB', (800, 600), color=(30, 30, 30))
          img.save('/tmp/capture_test/test_screenshot.png')
          print('Test fixture created')
          "

      - name: Run test suite
        run: ./venv/bin/python test_capture.py

  build-snap:
    name: Build snap (${{ matrix.arch }})
    needs: test          # only runs if tests pass
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building snap version: $VERSION"

      - name: Update snapcraft.yaml version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^version:.*/version: \"${VERSION}\"/" snapcraft.yaml
          grep "^version:" snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --destructive-mode

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          retention-days: 30

  publish-snap:
    name: Publish to Snap Store
    needs: build-snap    # only runs after both arch builds succeed
    runs-on: ubuntu-22.04

    steps:
      - name: Download amd64 snap
        uses: actions/download-artifact@v4
        with:
          name: capture-snap-amd64
          path: snaps/

      - name: Download arm64 snap
        uses: actions/download-artifact@v4
        with:
          name: capture-snap-arm64
          path: snaps/

      - name: Determine publish channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          else
            CHANNEL="stable"
          fi
          echo "CHANNEL=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Publishing to channel: $CHANNEL"

      - name: Publish snaps to Snap Store
        run: |
          sudo snap install snapcraft --classic
          for snap_file in snaps/*.snap; do
            echo "Publishing: $snap_file to ${{ steps.channel.outputs.CHANNEL }}"
            snapcraft upload --release="${{ steps.channel.outputs.CHANNEL }}" "$snap_file"
          done
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
