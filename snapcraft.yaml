name: capture
title: Capture
base: core22
version: "2.0.3"
summary: Local-first screenshot enhancement and library tool
description: |
  Capture is a forensic-grade desktop application for security professionals
  that enhances screenshot quality, sanitizes PII, and maintains chain-of-custody.
  100% local — zero cloud uploads, complete privacy.

license: GPL-3.0
website: https://github.com/OP-88/Capture
source-code: https://github.com/OP-88/Capture
issues: https://github.com/OP-88/Capture/issues
contact: https://github.com/OP-88/Capture/issues

grade: stable
confinement: strict

architectures:
  - build-on: amd64
  - build-on: arm64

# Suppress linter warnings for PySide6 bundled libs Capture doesn't directly use
# (QtWebEngine, multimedia codecs, 3D parser — pulled in transitively by pip)
lint:
  ignore:
    - library:
      - lib/python3.10/site-packages/PySide6/Qt/lib/libQt6Quick3DGlslParser.so.6
      - lib/python3.10/site-packages/PySide6/Qt/lib/libavcodec.so
      - lib/python3.10/site-packages/PySide6/Qt/lib/libavcodec.so.61.19.101
      - lib/python3.10/site-packages/PySide6/Qt/lib/libavformat.so
      - lib/python3.10/site-packages/PySide6/Qt/lib/libavformat.so.61.7.103
      - lib/python3.10/site-packages/PySide6/Qt/lib/libavutil.so
      - lib/python3.10/site-packages/PySide6/Qt/lib/libavutil.so.59.39.100
      - lib/python3.10/site-packages/PySide6/Qt/lib/libswresample.so
      - lib/python3.10/site-packages/PySide6/Qt/lib/libswresample.so.5.3.100
      - lib/python3.10/site-packages/PySide6/Qt/lib/libswscale.so
      - lib/python3.10/site-packages/PySide6/Qt/lib/libswscale.so.8.3.100
      - usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libGLX_mesa.so.0.0.0
      - usr/lib/x86_64-linux-gnu/libicuio.so.70.1
      - usr/lib/x86_64-linux-gnu/libicutest.so.70.1
      - usr/lib/x86_64-linux-gnu/libxcb-xinerama.so.0.0.0

apps:
  capture:
    command: bin/capture-launcher
    desktop: snap/gui/capture.desktop
    plugs:
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - removable-media
    environment:
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$LD_LIBRARY_PATH
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/4.00/tessdata
      MAGIC: $SNAP/usr/lib/file/magic.mgc
      QT_QPA_PLATFORM: xcb
      DISABLE_WAYLAND: "1"

  diagnose:
    command: bin/diagnose-launcher
    plugs:
      - home
      - desktop
      - x11
    environment:
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$LD_LIBRARY_PATH
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/4.00/tessdata
      MAGIC: $SNAP/usr/lib/file/magic.mgc
      QT_QPA_PLATFORM: xcb
      DISABLE_WAYLAND: "1"

parts:
  capture:
    plugin: python
    source: .
    python-packages:
      - . # Installs via setup.py
    build-environment:
      - PIP_NO_CACHE_DIR: "true"
      - PIP_PREFER_BINARY: "1"
    build-packages:
      - python3-dev
      - python3-pip
      - git
    stage-packages:
      # Core Qt / display stack
      - libgl1
      - libegl1
      - libxkbcommon-x11-0
      - libdbus-1-3
      # XCB platform plugin deps
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-xinerama0
      - libxcb-cursor0
      - libxcb-shape0
      - libxcb-xfixes0
      # Missing deps flagged by linter (PySide6/QtWebEngineWidgets pulls these in)
      - libxcomposite1   # libXcomposite.so.1
      - libxdamage1      # libXdamage.so.1
      - libxrandr2       # libXrandr.so.2
      - libxtst6         # libXtst.so.6
      - libasound2       # libasound.so.2  (ALSA)
      - libnspr4         # libnspr4.so / libplc4.so / libplds4.so
      - libnss3          # libnss3.so / libnssutil3.so / libsmime3.so
      - libxkbfile1      # libxkbfile.so.1
      # OCR
      - tesseract-ocr
      - tesseract-ocr-eng
      # File type validation
      - libmagic1
      - libmagic-mgc
      - file

  launcher:
    plugin: dump
    source: .
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/bin

      cat > $CRAFT_PART_INSTALL/bin/capture-launcher << 'EOF'
      #!/bin/bash
      export PYTHONPATH="$SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages"
      exec "$SNAP/bin/python3" "$SNAP/bin/run.py" "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/capture-launcher

      cat > $CRAFT_PART_INSTALL/bin/diagnose-launcher << 'EOF'
      #!/bin/bash
      export PYTHONPATH="$SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages"
      exec "$SNAP/bin/python3" "$SNAP/bin/diagnose" "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/diagnose-launcher
